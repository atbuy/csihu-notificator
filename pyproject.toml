[project]
name = "csihu"
version = "3.4.17"
description = "A bot that is used for the CompSci Discord Server"
authors = [{ name = "atbuy", email = "buy@atbuy.dev" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "python-urbandict==0.3.15",
  "discord.py==2.7.1",
  "beautifulsoup4==4.14.3",
  "lxml==6.1.0",
  "sqlalchemy[asyncio]==2.0.49",
  "asyncpg==0.31.0",
  "pydantic==2.13.3",
  "alembic==1.18.4",
  "selenium==4.43.0",
  "pydantic-settings==2.14.2",
  "prometheus-async==26.1.0",
  "aiohttp==3.14.1",
]

[project.optional-dependencies]
dev = ["pre-commit==4.6.0", "ruff==0.15.12"]

[project.urls]
"Homepage" = "https://github.com/atbuy/csihu-notificator"
"Bug Tracker" = "https://github.com/atbuy/csihu-notificator/issues"
"CI/CD" = "https://github.com/atbuy/csihu-notificator/actions"

[tool.setuptools]
packages = ["csihu"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
